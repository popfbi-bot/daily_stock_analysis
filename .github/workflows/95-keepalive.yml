name: 保活（防止定时任务被 GitHub 自动停用）

# 【这个文件解决什么问题】
# GitHub 规定：公开仓库如果 60 天内默认分支（main）没有任何提交，
# 会自动停用仓库里所有 schedule 触发的 workflow。
#
# 本仓库是 fork，长期没有自己的提交，所以「每日股票分析」在 2026-08-10 之后
# 被静默停用，定时不再触发 —— 表现就是"配置都对，但收不到推送邮件"。
#
# 本 workflow 每月往 main 分支写一次时间戳，让仓库保持"活跃"，
# 从而让「每日股票分析」的 cron 持续有效。手动点 Run workflow 也会立刻保活一次。
#
# 不需要了就直接删掉本文件。

on:
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 日 UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 写入保活时间戳
        run: |
          mkdir -p .keepalive
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive/last-alive.txt
          echo "本次保活时间: $(cat .keepalive/last-alive.txt)"

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-alive.txt
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(keepalive): 保持仓库活跃，防止 schedule 被停用"
          git push
          echo "已提交，仓库活跃时间已刷新"

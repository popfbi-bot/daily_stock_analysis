name: 邮件自检

# 【这个文件解决什么问题】
# 原项目的「每日股票分析」workflow 在日志的「📋 配置检查」段落里
# 只打印了企业微信/飞书/Telegram/Discord/Slack 等渠道，唯独没有邮件，
# 所以邮件配错了在日志里根本看不出来。
#
# 这个 workflow 补上这个盲区。
#
# 【三种触发方式】
#   1. 手动：Actions → 邮件自检 → Run workflow
#      send_test_email = true   → 体检配置，再真实登录 SMTP 发一封测试邮件
#      send_test_email = false  → 只体检配置，不发任何消息
#   2. 自身变更：本文件被修改并推送到 main 时自动跑一次
#      （paths 限定为只有本文件变化才触发，避免被其他提交误带动）
#   3. 以上任一方式下，体检报告都会写到 .diag/notify-check-latest.txt，
#      并提交回仓库，这样不需要仓库管理权限也能读取结果。
#
# 【五段输出】
#   ① 确认这次跑的到底是哪个仓库、哪个分支
#   ② 列出本仓库所有 Variables 的名字（不含值）
#   ③ 逐个探测 17 个常见 Secret 名，告诉你哪些真的存在
#   ④ 给出结论与排查顺序
#   ⑤ 探测仓库 Environments 名单（STOCK_LIST 是否还在）

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: '是否真实发送一封测试邮件'
        required: true
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/96-notify-test.yml'

# 需要 write 才能把体检报告提交回仓库。
# 本仓库是公开仓库，报告里只有「变量名 + 长度」，不含任何配置内容。
permissions:
  contents: write

jobs:
  notify-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data logs reports .diag

      # ------------------------------------------------------------------
      # 配置可见性全量体检：只报告"名字在不在"，绝不打印任何值
      # 同时把同样的内容写进 .diag/notify-check-latest.txt 供外部读取
      # ------------------------------------------------------------------
      - name: 配置可见性全量体检
        env:
          GH_REPO: ${{ github.repository }}
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_WORKFLOW: ${{ github.workflow_ref }}
          GH_ACTOR: ${{ github.actor }}
          VARS_JSON: ${{ toJSON(vars) }}

          SEC_EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          SEC_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SEC_EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          SEC_EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          SEC_EMAIL_USER: ${{ secrets.EMAIL_USER }}
          SEC_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SEC_EMAIL_PASSWD: ${{ secrets.EMAIL_PASSWD }}
          SEC_EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          SEC_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SEC_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SEC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SEC_GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SEC_LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
          SEC_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SEC_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, sys

          os.makedirs(".diag", exist_ok=True)
          _report = open(os.path.join(".diag", "notify-check-latest.txt"), "w", encoding="utf-8")
          _orig_print = print

          def print(*args, **kwargs):
              _orig_print(*args, **kwargs)
              _orig_print(*args, file=_report, **kwargs)

          def line(ch="=", n=64):
              print(ch * n)

          line()
          print("① 这次到底跑的是哪个仓库")
          line()
          print("仓库        :", os.getenv("GH_REPO"))
          print("触发事件    :", os.getenv("GH_EVENT"))
          print("分支 / ref  :", os.getenv("GH_REF"))
          print("workflow    :", os.getenv("GH_WORKFLOW"))
          print("触发人      :", os.getenv("GH_ACTOR"))
          print("")
          print("请核对上面这个仓库，必须就是你填 Secrets 的那一个。")
          print("fork 不会继承上游仓库的 Secrets，填到上游等于没填。")

          print("")
          line()
          print("② 本仓库 Variables 名字清单（不含值）")
          line()
          raw = os.getenv("VARS_JSON") or "{}"
          try:
              data = json.loads(raw)
          except Exception:
              data = {}
          if not isinstance(data, dict) or not data:
              print("全部为空：这个仓库一个 Variable 都没建。")
          else:
              names = sorted(data.keys())
              print("共 %d 个：" % len(names))
              for k in names:
                  print("   -", k)
              interesting = [k for k in names if "EMAIL" in k.upper() or "GEMINI" in k.upper()]
              if interesting:
                  print("")
                  print("其中与邮件/Gemini 相关的：", ", ".join(interesting))
              else:
                  print("")
                  print("其中没有名字带 EMAIL 或 GEMINI 的变量。")
                  print("如果你确实在 Variables 标签页建过，名字应该会出现在这里。")

          print("")
          line()
          print("③ 常见 Secret 名探测（只报存在与否与长度，不含值）")
          line()
          candidates = [
              ("EMAIL_SENDER", "邮件发件人地址"),
              ("EMAIL_PASSWORD", "邮件 SMTP 授权码"),
              ("EMAIL_RECEIVERS", "收件人"),
              ("EMAIL_SENDER_NAME", "发件人显示名"),
              ("EMAIL_USER", "邮件账号（别名写法）"),
              ("EMAIL_PASS", "邮件密码（别名写法）"),
              ("EMAIL_PASSWD", "邮件密码（别名写法）"),
              ("EMAIL_AUTH_CODE", "授权码（别名写法）"),
              ("SMTP_PASSWORD", "SMTP 密码（别名写法）"),
              ("MAIL_PASSWORD", "邮件密码（别名写法）"),
              ("GEMINI_API_KEY", "Gemini API Key"),
              ("GEMINI_API_KEYS", "Gemini Key 多枚写法"),
              ("GEMINI_KEY", "Gemini Key（别名写法）"),
              ("LLM_GEMINI_API_KEY", "LLM 通道的 Gemini Key"),
              ("GOOGLE_API_KEY", "Google API Key（别名写法）"),
              ("OPENAI_API_KEY", "OpenAI Key"),
              ("DEEPSEEK_API_KEY", "DeepSeek Key"),
          ]
          found_any = False
          for name, desc in candidates:
              val = os.getenv("SEC_" + name) or ""
              if val:
                  found_any = True
                  status = "已设置，长度 %d" % len(val)
              else:
                  status = "空 / 不存在"
              print("   %-20s %-24s %s" % (name, desc, status))

          print("")
          if not found_any:
              print("所有 17 个候选名全部为空。")
              print("说明这个仓库的 Actions 两层（Variables / Secrets）都读不到任何配置。")
          else:
              print("有名字被读到了。请把带「已设置」的行名，和本项目 workflow 实际使用的名字对齐：")
              print("   本项目读取的是 EMAIL_SENDER / EMAIL_PASSWORD / EMAIL_RECEIVERS / EMAIL_SENDER_NAME")
              print("   名字不一致时，即使值填了也不会被使用。")

          print("")
          line()
          print("④ 结论与排查顺序")
          line()
          sender = (os.getenv("SEC_EMAIL_SENDER") or "").strip()
          password = (os.getenv("SEC_EMAIL_PASSWORD") or "").strip()
          if sender and password:
              print("邮件三要素已就位，可以继续看下一段输出的真实发送结果。")
          else:
              print("邮件配置不完整。而且要注意：这不是「值填错了」，")
              print("是 EMAIL_SENDER / EMAIL_PASSWORD 这两个名字在这个仓库里根本查不到。")
              print("")
              print("按顺序排查（都在 仓库页 → Settings → Secrets and variables）：")
              print("")
              print("  1) 左边栏点的是不是 Actions 这一项？")
              print("     如果点成了 Codespaces 或 Dependabot，名字存在那边的库里，")
              print("     Actions 读不到，症状就是这里全空。")
              print("")
              print("  2) 在 Actions 里面，Secret 要建在 Secrets 标签页，不是 Variables 标签页。")
              print("     本项目的 workflow 里 EMAIL_SENDER / EMAIL_RECEIVERS / EMAIL_SENDER_NAME")
              print("     写成 vars 或 secrets 都认，但 EMAIL_PASSWORD 只读 secrets。")
              print("     如果你把授权码建成了 Variable，会读不到。")
              print("")
              print("  3) 是不是建在 Settings → Environments 里了？")
              print("     Environment secrets 只有在 workflow 的 job 上写 environment: 名字")
              print("     才会注入。本项目没写，所以读不到。请改建到仓库级 Secrets。")
              print("")
              print("  4) 仓库对不对？必须是 popfbi-bot/daily_stock_analysis。")
              print("     Secrets 不随 fork 继承，填在上游 ZhuLinsen 那边等于没填。")
              print("")
              print("  5) 别点错页：Settings → Integrations → Email notifications")
              print("     是 GitHub 自己的 push 通知，和本项目完全无关，填了也不生效。")

          _report.close()
          PY

      - name: 项目自带的通知配置检查（不发消息）
        continue-on-error: true
        env:
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME }}
        run: python main.py --check-notify

      - name: 真实发送一封测试邮件
        if: ${{ always() && (github.event_name == 'push' || github.event.inputs.send_test_email == 'true') }}
        env:
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME }}
        run: |
          python - <<'PY'
          import os, smtplib, sys
          from datetime import datetime
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.header import Header
          from email.utils import formataddr

          SMTP_CONFIGS = {
              "qq.com": ("smtp.qq.com", 465, True),
              "foxmail.com": ("smtp.qq.com", 465, True),
              "163.com": ("smtp.163.com", 465, True),
              "126.com": ("smtp.126.com", 465, True),
              "gmail.com": ("smtp.gmail.com", 587, False),
              "outlook.com": ("smtp-mail.outlook.com", 587, False),
              "hotmail.com": ("smtp-mail.outlook.com", 587, False),
              "live.com": ("smtp-mail.outlook.com", 587, False),
              "sina.com": ("smtp.sina.com", 465, True),
              "sohu.com": ("smtp.sohu.com", 465, True),
              "aliyun.com": ("smtp.aliyun.com", 465, True),
              "139.com": ("smtp.139.com", 465, True),
          }

          os.makedirs(".diag", exist_ok=True)
          _report = open(os.path.join(".diag", "notify-check-latest.txt"), "a", encoding="utf-8")
          _orig_print = print

          def print(*args, **kwargs):
              _orig_print(*args, **kwargs)
              _orig_print(*args, file=_report, **kwargs)

          sender = (os.getenv("EMAIL_SENDER") or "").strip()
          password = (os.getenv("EMAIL_PASSWORD") or "").strip()
          raw_recv = (os.getenv("EMAIL_RECEIVERS") or "").strip()
          receivers = [r.strip() for r in raw_recv.split(",") if r.strip()]
          if not receivers and sender:
              receivers = [sender]

          print("")
          print("=" * 50)
          print("发信链路实测")
          print("=" * 50)
          if sender:
              masked = sender[:3] + "***@" + sender.split("@")[-1]
          else:
              masked = "空"
          print("EMAIL_SENDER    :", masked)
          print("EMAIL_PASSWORD  :", ("已读到，长度 %d" % len(password)) if password else "空")
          print("EMAIL_RECEIVERS :", ("已读到，%d 个收件人" % len(receivers)) if receivers else "空（运行时会回落到发件人自己）")
          print("EMAIL_SENDER_NAME:", "已设置" if os.getenv("EMAIL_SENDER_NAME") else "(未设置，用默认值)")

          if not sender or not password:
              print("")
              print("结论：邮件配置不完整，跳过发信。")
              print("应用运行到这里只会打印『邮件配置不完整，跳过推送』然后直接 return False。")
              print("具体原因看上面第 ② ③ ④ 段体检输出，那里会指出名字到底差在哪。")
              _report.close()
              sys.exit(1)

          domain = sender.split("@")[-1].lower()
          known = domain in SMTP_CONFIGS
          server, port, use_ssl = SMTP_CONFIGS.get(domain, ("smtp." + domain, 465, True))
          print("")
          print("SMTP 连通测试")
          print("发件域名 %s -> %s %s:%d (SSL=%s)"
                % (domain, "内置识别" if known else "未命中白名单，回退通用配置", server, port, use_ssl))
          if not known:
              print("提示：该域名不在内置白名单内。代码只会拼 smtp.<域名>:465，")
              print("      像 vip.163.com / 企业自有域名通常拼不出可用的 SMTP 地址，会连接失败。")

          subject = "邮件自检通过 - %s" % datetime.now().strftime("%Y-%m-%d %H:%M")
          display_name = os.getenv("EMAIL_SENDER_NAME") or "daily_stock_analysis股票分析助手"
          body = (
              "这封邮件由 GitHub Actions 的『邮件自检』发出。\n\n"
              "收到它，说明 EMAIL_SENDER、EMAIL_PASSWORD、收件人三者都没问题，\n"
              "SMTP 登录和投递链路是通的。\n\n"
              "那么收不到每日报告，原因就在任务没有运行，而不是邮件配置。\n"
          )

          msg = MIMEMultipart("alternative")
          msg["Subject"] = Header(subject, "utf-8")
          msg["From"] = formataddr((str(Header(display_name, "utf-8")), sender))
          msg["To"] = ", ".join(receivers)
          msg.attach(MIMEText(body, "plain", "utf-8"))

          try:
              if use_ssl:
                  srv = smtplib.SMTP_SSL(server, port, timeout=30)
              else:
                  srv = smtplib.SMTP(server, port, timeout=30)
                  srv.starttls()
              srv.login(sender, password)
              srv.send_message(msg)
              srv.quit()
          except smtplib.SMTPAuthenticationError as exc:
              print("")
              print("认证失败: %s" % exc)
              print("EMAIL_PASSWORD 不是邮箱登录密码，必须填 SMTP 授权码。")
              print("QQ 邮箱：设置 → 账户与安全 → POP3/IMAP/SMTP 服务 → 开启 → 短信验证 → 拿 16 位授权码。")
              print("163 邮箱：设置 → POP3/SMTP/IMAP → 开启 IMAP/SMTP 服务 → 新增授权密码。")
              _report.close()
              sys.exit(1)
          except Exception as exc:
              print("")
              print("发送失败: %s: %s" % (type(exc).__name__, exc))
              _report.close()
              sys.exit(1)

          print("")
          print("登录并发送成功，收件人共 %d 个。" % len(receivers))
          print("去收件箱确认一下，记得也看垃圾邮件 / 订阅邮件文件夹。")
          _report.close()
          PY

      # ------------------------------------------------------------------
      # 探测仓库 Environments 名单。
      # 起因：00-daily-analysis.yml 的 job 上写了 environment: STOCK_LIST，
      # 如果这个 Environment 被删掉，每日任务会在启动阶段直接失败。
      # 该接口对 GITHUB_TOKEN 常常返回 403，读不到就只给指引，不算失败。
      # ------------------------------------------------------------------
      # 必须写 if: always()。GitHub Actions 在某一步失败后会跳过后续所有步骤，
      # continue-on-error 只保证"这步失败不算 job 失败"，并不能让流程继续。
      # 少了 always()，发信步骤一失败，下面的探测与报告回传就全被跳过，
      # 结果就是只看得到一个红叉、什么诊断信息都拿不到。
      - name: 探测仓库 Environments 名单
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' | tee -a .diag/notify-check-latest.txt
          import os, json, urllib.request, urllib.error

          repo = os.getenv("GH_REPO")
          token = os.getenv("GH_TOKEN") or ""
          url = "https://api.github.com/repos/%s/environments" % repo

          print("")
          print("=" * 64)
          print("⑤ 仓库 Environments 名单（判断 environment: STOCK_LIST 是否还在）")
          print("=" * 64)

          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "User-Agent": "notify-check",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              body = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
              data = json.loads(body)
              envs = data.get("environments") or []
              names = sorted(e.get("name", "") for e in envs)
              print("total_count :", data.get("total_count"))
              if not names:
                  print("名单为空：本仓库目前一个 Environment 都没有。")
                  print("")
                  print("注意：00-daily-analysis.yml 的 job 上写了 environment: STOCK_LIST。")
                  print("      Environment 不存在时，该 job 会在启动阶段直接失败，")
                  print("      表现为「每日股票分析」一跑就红、连日志都很少。")
              else:
                  print("名单如下：")
                  for n in names:
                      print("   -", n)
                  print("")
                  if "STOCK_LIST" in names:
                      print("STOCK_LIST 存在，每日任务的 environment 声明有效。")
                  else:
                      print("STOCK_LIST 不在名单里。")
                      print("00-daily-analysis.yml 的 job 声明了 environment: STOCK_LIST，")
                      print("该环境缺失会让每日任务在启动阶段失败。")
                      print("处理：Settings → Environments → New environment，名字填 STOCK_LIST。")
                      print("（不往里面放任何东西也行，声明对得上就能正常启动。）")
          except urllib.error.HTTPError as exc:
              print("接口返回 HTTP %s：GITHUB_TOKEN 没有读取 Environments 的权限。" % exc.code)
              print("无法自动判断，请手动看一眼：")
              print("   Settings → Environments")
              print("   https://github.com/%s/settings/environments" % repo)
              print("如果列表为空，而 00-daily-analysis.yml 里写着 environment: STOCK_LIST，")
              print("请新建一个同名 Environment（内容可留空）。")
          except Exception as exc:
              print("探测失败：%s: %s" % (type(exc).__name__, exc))
              print("请手动查看：https://github.com/%s/settings/environments" % repo)
          PY

      # ------------------------------------------------------------------
      # 把报告提交回仓库，方便在无仓库管理权限时读取结果。
      # 报告内容无变化时不会产生提交。
      # 提交信息带 [skip ci]，确保不会自己触发自己。
      # ------------------------------------------------------------------
      - name: 把体检报告提交回仓库
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ ! -f .diag/notify-check-latest.txt ]; then
            echo "报告文件不存在，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .diag/notify-check-latest.txt
          if git diff --cached --quiet; then
            echo "报告内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(diag): 更新邮件自检报告 [skip ci]"
          git push
          echo "报告已提交到 .diag/notify-check-latest.txt"

name: auto-screen

on:
  schedule:
    # 工作日北京时间 17:00（UTC 09:00）盘后选股，赶在主任务 18:00 之前写回 STOCK_LIST
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

# 说明：GITHUB_TOKEN 无法写 Repository Variable/Secret（GitHub 硬限制），
# 因此写回改用带 repo 权限的 PAT（仓库 Secret: GH_PAT）。
permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 技术面选股
        env:
          UNIVERSE_SIZE: '250'
          MAX_STOCKS: '15'
          MIN_STOCKS: '5'
          # 核心自选股池：始终保留，机器人只增补新异动股、不删除。
          # 核心池取现有 STOCK_LIST（Secret）；若单独建了 CORE_STOCK_LIST 变量则优先用它。
          CORE_STOCK_LIST: ${{ vars.CORE_STOCK_LIST || secrets.STOCK_LIST }}
          STOCK_LIST_FALLBACK: '600519'
          DRY_RUN: '1'
          OUTPUT_FILE: selected.txt
        run: |
          python auto_screen.py
          echo "本轮入选: $(cat selected.txt)"

      - name: 写回 STOCK_LIST 变量（供主任务读取）
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 GH_PAT（带 repo 权限的 PAT），跳过写回。请到仓库 Secrets 建 GH_PAT。"
            exit 0
          fi
          STOCKS="$(cat selected.txt)"
          if [ -z "$STOCKS" ]; then
            echo "选股结果为空，跳过写回"
            exit 0
          fi
          gh variable set STOCK_LIST --body "$STOCKS"
          echo "已更新 STOCK_LIST: $STOCKS"

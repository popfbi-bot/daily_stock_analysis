# ============================================================
#  同步架构（2026-10-07 起）
# ============================================================
#    本机 ──push──> CNB       随时手动（git pushall / tools/cnb-push.sh）
#    CNB ──crontab(每日 03:17) ──push──> GitHub    失败自动重试
#
#  本机不再直连 GitHub —— 那边的网络常年不稳，每次都要卡在重试上。
#  改成每天由 CNB 统一同步一次，同步失败会在云端指数退避重试
#  （单次最多 50 分钟），跨天没补上的由下一次 crontab 接着来。
#
#  凭据从密钥仓库 cnb-sync-secrets 经 imports 注入，不落盘、不进 git 历史。
# ============================================================
main:
  "crontab: 17 3 * * *":
    - name: 同步到GitHub
      imports:
        - https://cnb.cool/cnbnasa/cnb-sync-secrets/-/blob/main/env.yml
      stages:
        - name: push
          script: sh .cnb/push-to-github.sh
          envs:
            CNB_TO_GH_MAX_MINUTES: "20"
  # 需要立刻同步时手动触发
  api_trigger:
    - name: 手动同步到GitHub
      imports:
        - https://cnb.cool/cnbnasa/cnb-sync-secrets/-/blob/main/env.yml
      stages:
        - name: push
          script: sh .cnb/push-to-github.sh
          envs:
            CNB_TO_GH_MAX_MINUTES: "20"

  # --- 网页手动触发事件（按钮定义在 .cnb/web_trigger.yml）---
  # api_trigger 只能走 API，网页上点不到；web_trigger 才是网页入口。

  web_trigger_sync:
    - name: 立即同步到 GitHub
      imports:
        - https://cnb.cool/cnbnasa/cnb-sync-secrets/-/blob/main/env.yml
      stages:
        - name: push
          script: sh .cnb/push-to-github.sh
          envs:
            CNB_TO_GH_MAX_MINUTES: "20"

  web_trigger_check:
    - name: 同步自检
      imports:
        - https://cnb.cool/cnbnasa/cnb-sync-secrets/-/blob/main/env.yml
      stages:
        - name: check
          script: |
            echo "凭据注入情况："
            echo "  GITHUB_USERNAME 长度=${#GITHUB_USERNAME}"
            echo "  GITHUB_TOKEN    长度=${#GITHUB_TOKEN}"
            echo ""
            echo "CNB 注入的仓库信息："
            echo "  CNB_REPO_SLUG = ${CNB_REPO_SLUG:-未注入}"
            echo "  分支= ${CNB_BRANCH:-main}"
            echo ""
            echo "远端连通性："
            git remote -v | head -4
